<!doctype html>
<html lang="de">
  <head>
    <meta charset="utf-8" />
    <title>ME/CFS App</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#f7f9fc" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="ME/CFS" />
    <link rel="icon" type="image/png" href="icons/icon-192x192.png" />
    <link rel="apple-touch-icon" href="icons/icon-192x192.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="" />
    <link
      href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500&amp;display=swap"
      rel="stylesheet"
    />
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet" />
    <script>
      (() => {
        try {
          const stored = localStorage.getItem('mecfs.theme');
          const theme =
            stored === 'light' || stored === 'dark'
              ? stored
              : matchMedia('(prefers-color-scheme: dark)').matches
                ? 'dark'
                : 'light';
          document.documentElement.style.colorScheme = theme;
          document.documentElement.setAttribute('data-color-scheme', theme);
          const themeColor = theme === 'dark' ? '#131318' : '#f7f9fc';
          document.querySelector('meta[name="theme-color"]')?.setAttribute('content', themeColor);
        } catch {}
      })();
    </script>
    <link rel="manifest" href="manifest.webmanifest" />
  </head>
  <body>
    <app-root></app-root>
    <noscript>Bitte JavaScript aktivieren, um die App zu nutzen.</noscript>
  </body>
</html>
