name: Deploy Firebase Hosting

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Restore src folder layout
        run: |
          mkdir -p src/app src/environments
          for f in main.ts styles.scss index.html; do
            if [ -f "$f" ] && [ ! -f "src/$f" ]; then
              cp -f "$f" "src/$f"
            fi
          done
          if [ -d environments ] && [ ! -f src/environments/environment.ts ]; then
            cp -a environments/. src/environments/
          fi
          if [ -d app ] && [ ! -f src/app/app.config.ts ]; then
            cp -a app/. src/app/
          fi
          test -f src/main.ts
          test -f src/styles.scss
          test -f src/environments/environment.ts
          test -d src/app/pages
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        env:
          npm_config_registry: https://registry.npmjs.org/
        run: |
          sed -i 's|https://repo.kvhessen.de:8082/repository/npm-group/|https://registry.npmjs.org/|g' package-lock.json
          npm ci
      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_MECFS_APP_CCE8B }}
          projectId: mecfs-app-cce8b
          channelId: live
