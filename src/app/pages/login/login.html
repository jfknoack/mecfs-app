<section class="login">
  <button
    class="login__theme-toggle"
    matIconButton
    type="button"
    [attr.aria-label]="theme.mode() === 'dark' ? 'Hellmodus' : 'Dunkelmodus'"
    (click)="theme.toggle()"
  >
    <mat-icon>{{ theme.mode() === 'dark' ? 'light_mode' : 'dark_mode' }}</mat-icon>
  </button>

  <mat-card class="login__card">
    <mat-card-header>
      <mat-card-title>Login</mat-card-title>
      <mat-card-subtitle>Anmeldung mit Google. Nur freigeschaltete Accounts.</mat-card-subtitle>
    </mat-card-header>

    <mat-card-content>
      <div class="login__actions">
        @if (error()) {
          <p class="login__error">{{ error() }}</p>
        }

        <button matButton="filled" type="button" [disabled]="busy()" (click)="login()">
          Mit Google anmelden
        </button>
      </div>
    </mat-card-content>
  </mat-card>
</section>
